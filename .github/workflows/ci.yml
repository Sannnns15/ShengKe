name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shengke
          POSTGRES_PASSWORD: shengke_secret
          POSTGRES_DB: shengke_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U shengke
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx pytest-asyncio pytest-cov

      - name: Lint with ruff
        run: ruff check app/ --exit-zero

      - name: Run pytest
        run: pytest tests/ -v --cov=app --cov-report=term-missing --asyncio-mode=auto
        env:
          DATABASE_URL: postgresql+asyncpg://shengke:shengke_secret@localhost:5432/shengke_dev
          DATABASE_SYNC_URL: postgresql://shengke:shengke_secret@localhost:5432/shengke_dev
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo export (web)
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000/api/v1

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/dist/
          retention-days: 3
